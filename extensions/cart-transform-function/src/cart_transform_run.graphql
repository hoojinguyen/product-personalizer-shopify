query CartTransformRunInput {
  cart {
    lines {
      id
      quantity
      cost {
        amountPerQuantity {
          amount
          currencyCode
        }
      }
      upchargeAmount: attribute(key: "_upcharge_amount") {
        value
      }
      previewUrl: attribute(key: "_preview_url") {
        value
      }
    }
  }
}
